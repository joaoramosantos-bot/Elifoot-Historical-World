<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elifoot Historical World — Protótipo</title>
<style>
body{margin:0;background:#10151b;color:#e9eef4;font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{background:#18212b;border-bottom:1px solid #34404d;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.card{background:#18212b;border:1px solid #34404d;border-radius:10px;padding:16px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#111820;border-radius:8px;padding:12px}.label{color:#9eacba;font-size:12px}.value{font-size:20px;font-weight:700;margin-top:4px}button,select,input{background:#263340;color:#fff;border:1px solid #475666;border-radius:7px;padding:9px 12px}button{cursor:pointer;font-weight:700}button.primary{background:#3b7ddd;border-color:#3b7ddd;font-size:16px;padding:12px 18px}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px;border-bottom:1px solid #2d3844}th{color:#aebbc8;font-size:12px}.news{max-height:300px;overflow:auto}.muted{color:#9eacba}.ok{color:#8bd48b}.danger{color:#ff9c9c}@media(max-width:800px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header><h1>⚽ Elifoot Historical World — Protótipo</h1><span id="date">01/09/1900</span></header>
<div class="wrap">
<div id="setup" class="card"><h2>Novo mundo</h2><p class="muted">O protótipo começa em 1 de Setembro de 1900. A liga nasce quando existem pelo menos 8 clubes.</p><div class="actions"><input id="worldName" value="Meu Mundo" aria-label="Nome do mundo"><select id="clubChoice" aria-label="Escolher clube"></select><button class="primary" onclick="start()">CRIAR MUNDO</button><button onclick="loadSave()">CARREGAR</button></div></div>
<div id="game" hidden>
<div class="cards"><div class="stat"><div class="label">DATA</div><div class="value" id="d2"></div></div><div class="stat"><div class="label">CLUBE</div><div class="value" id="club"></div></div><div class="stat"><div class="label">CAIXA</div><div class="value" id="cash"></div></div><div class="stat"><div class="label">PRÓXIMO JOGO</div><div class="value" id="next"></div></div></div>
<div class="card"><div class="actions"><button class="primary" id="advance" onclick="advanceNext()">AVANÇAR ATÉ AO PRÓXIMO JOGO</button><button id="play" onclick="playMatch()" disabled>JOGAR JOGO</button><button onclick="saveGame()">GUARDAR</button><button onclick="resetGame()">NOVO MUNDO</button></div><p id="status" class="muted"></p></div>
<div class="grid"><main>
<div class="card"><h2>Próximo jogo</h2><div id="fixture"></div></div>
<div class="card"><h2>Classificação</h2><div id="table"></div></div>
<div class="card"><h2>Plantel</h2><div id="squad"></div></div>
</main><aside>
<div class="card"><h2>Notícias</h2><div id="news" class="news"></div></div>
<div class="card"><h2>História</h2><div id="history" class="news"></div></div>
</aside></div></div></div>
<script>
const names=['London Rovers','Oxford Athletic','Manchester FC','Birmingham Town','Liverpool Albion','Sheffield United','Bristol City','Leeds Athletic','Derby County','Nottingham FC'];
let g;
function fmt(d){return d.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric'})}
function iso(d){return d.toISOString().slice(0,10)}
function monthKey(s){return s.slice(0,7)}
function seedPlayers(){return Array.from({length:14},(_,i)=>({name:['Arthur','Thomas','William','George','Henry','Albert','James','Edward','Charles','Frederick','Walter','Robert','Frank','John'][i],age:18+Math.floor(Math.random()*15),pos:['GR','DEF','DEF','DEF','MED','MED','MED','MED','ALA','ALA','ATA','ATA','ATA','ATA'][i],tech:35+Math.floor(Math.random()*35),pot:55+Math.floor(Math.random()*40)}))}
function fillClubChoices(){document.getElementById('clubChoice').innerHTML=names.slice(0,8).map(n=>`<option value="${n}">${n}</option>`).join('')}
fillClubChoices();
function start(){let n=document.getElementById('worldName').value||'Meu Mundo';let selected=document.getElementById('clubChoice').value;g={name:n,date:'1900-09-01',club:selected,cash:1000,clubs:names.slice(0,8).map((n,i)=>({name:n,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,str:45+i*2})),players:seedPlayers(),news:['Mundo criado em 01/09/1900.','O futebol ainda está numa fase amadora e as competições formais estão a nascer.'],history:['01/09/1900 — Início do mundo.'],matches:[],played:0};schedule();saveGame();document.getElementById('setup').hidden=true;document.getElementById('game').hidden=false;document.getElementById('status').textContent='Escolheste '+g.club+'. Avança até ao primeiro jogo.';render()}
function schedule(){g.matches=[];let pairs=[];for(let i=0;i<g.clubs.length;i++)for(let j=i+1;j<g.clubs.length;j++)for(let r=0;r<2;r++)pairs.push({home:r?g.clubs[j].name:g.clubs[i].name,away:r?g.clubs[i].name:g.clubs[j].name});let start=new Date('1900-10-01T12:00:00');pairs.forEach((m,k)=>{let d=new Date(start);d.setMonth(d.getMonth()+k);g.matches.push({...m,date:iso(d),played:false,score:null})})}
function currentNext(){return g.matches.find(m=>!m.played&&m.date>=g.date&&(m.home===g.club||m.away===g.club))}
function advanceOneMonth(){let d=new Date(g.date+'T12:00:00');d.setMonth(d.getMonth()+1);d.setDate(1);g.date=iso(d);g.news.unshift(`${fmt(d)} — O mundo avançou um mês.`);if(g.news.length>30)g.news.pop()}
function advanceNext(){let m=currentNext();if(!m)return;while(monthKey(g.date)<monthKey(m.date))advanceOneMonth();if(monthKey(g.date)===monthKey(m.date)){document.getElementById('status').textContent='Chegámos ao mês do jogo. Clica em JOGAR JOGO para disputar a partida.'}saveGame();render()}
function strength(club){let c=g.clubs.find(x=>x.name===club);return c.str+(club===g.club?5:0)}
function playMatch(){let m=currentNext();if(!m||monthKey(g.date)!==monthKey(m.date))return;let hs=strength(m.home),as=strength(m.away);let hg=Math.max(0,Math.min(5,Math.round(1.1+(hs-as)/20+Math.random()*2.2)));let ag=Math.max(0,Math.min(5,Math.round(1.0+(as-hs)/20+Math.random()*2.2)));m.score=[hg,ag];m.played=true;g.played++;let H=g.clubs.find(c=>c.name===m.home),A=g.clubs.find(c=>c.name===m.away);H.p++;A.p++;H.gf+=hg;H.ga+=ag;A.gf+=ag;A.ga+=hg;if(hg>ag){H.w++;A.l++;H.pts+=3}else if(ag>hg){A.w++;H.l++;A.pts+=3}else{H.d++;A.d++;H.pts++;A.pts++}g.cash+=m.home===g.club?35:(m.away===g.club?-10:0);let result=`${m.home} ${hg}-${ag} ${m.away}`;g.news.unshift(`${fmt(new Date(m.date+'T12:00:00'))} — ${result}.`);g.history.unshift(`${fmt(new Date(m.date+'T12:00:00'))} — Resultado: ${result}.`);document.getElementById('status').textContent=`Jogo disputado: ${result}. A classificação foi atualizada.`;saveGame();render()}
function saveGame(){if(g)localStorage.setItem('elifootPrototype',JSON.stringify(g))}
function loadSave(){let x=localStorage.getItem('elifootPrototype');if(!x)return alert('Não existe jogo guardado.');g=JSON.parse(x);document.getElementById('setup').hidden=true;document.getElementById('game').hidden=false;document.getElementById('status').textContent='Jogo carregado.';render()}
function resetGame(){localStorage.removeItem('elifootPrototype');location.reload()}
function render(){let dateObj=new Date(g.date+'T12:00:00');document.getElementById('date').textContent=fmt(dateObj);document.getElementById('d2').textContent=fmt(dateObj);document.getElementById('club').textContent=g.club;document.getElementById('cash').textContent=g.cash+' £';let m=currentNext();document.getElementById('next').textContent=m?fmt(new Date(m.date+'T12:00:00')):'—';document.getElementById('play').disabled=!m||monthKey(g.date)!==monthKey(m.date);document.getElementById('fixture').innerHTML=m?`<b>${fmt(new Date(m.date+'T12:00:00'))}</b><br><strong>${m.home}</strong> vs <strong>${m.away}</strong>`:'Sem jogo agendado';let rows=[...g.clubs].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));document.getElementById('table').innerHTML='<table><tr><th>#</th><th>Clube</th><th>J</th><th>V</th><th>E</th><th>D</th><th>DG</th><th>Pts</th></tr>'+rows.map((c,i)=>`<tr><td>${i+1}</td><td>${c.name}${c.name===g.club?' ★':''}</td><td>${c.p}</td><td>${c.w}</td><td>${c.d}</td><td>${c.l}</td><td>${c.gf-c.ga}</td><td><b>${c.pts}</b></td></tr>`).join('')+'</table>';document.getElementById('squad').innerHTML='<table><tr><th>Jogador</th><th>Idade</th><th>Pos</th><th>Téc.</th><th>Pot.</th></tr>'+g.players.map(p=>`<tr><td>${p.name}</td><td>${p.age}</td><td>${p.pos}</td><td>${p.tech}</td><td>${p.pot}</td></tr>`).join('')+'</table>';document.getElementById('news').innerHTML=g.news.map(x=>`<p>${x}</p>`).join('');document.getElementById('history').innerHTML=g.history.map(x=>`<p>${x}</p>`).join('')}
</script></body></html>
